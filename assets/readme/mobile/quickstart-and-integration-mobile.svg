<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1098" viewBox="0 0 900 1098" font-family="Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="Lorebook Manager"><rect width="900" height="1098" fill="#f5f3ef"/><rect x="38" y="30" width="10" height="100" rx="5" fill="#82745e" stroke="none" stroke-width="2"/><text x="68" y="59" font-size="38" fill="#383531" font-weight="600">로어북 매니저: 게으름뱅이</text><text x="68" y="98" font-size="30" fill="#82745e" font-weight="600">Sloth the Lorebook Manager · Quick start</text><rect x="38" y="170" width="824" height="210" rx="18" fill="#fff" stroke="#ded6c8" stroke-width="2"/><text x="65" y="212" font-size="34" fill="#383531" font-weight="600">01  서재 열기</text><text x="65" y="248" font-size="29" fill="#82745e" font-weight="600">Open the library</text><path d="M65 268H835" stroke="#ded6c8" stroke-width="2"/><rect x="65" y="285" width="770" height="76" rx="9" fill="#f5f3ef" stroke="none" stroke-width="2"/><text x="83" y="316" font-size="29" fill="#383531" font-weight="600">확장 메뉴 → 로어북 매니저: 게으름뱅이</text><text x="83" y="348" font-size="26" fill="#82745e" font-weight="400">Extensions → Sloth the Lorebook Manager</text><rect x="38" y="400" width="824" height="210" rx="18" fill="#fff" stroke="#ded6c8" stroke-width="2"/><text x="65" y="442" font-size="34" fill="#383531" font-weight="600">02  원하는 로어 찾기</text><text x="65" y="478" font-size="29" fill="#82745e" font-weight="600">Find lore</text><path d="M65 498H835" stroke="#ded6c8" stroke-width="2"/><rect x="65" y="515" width="770" height="76" rx="9" fill="#f5f3ef" stroke="none" stroke-width="2"/><text x="83" y="546" font-size="29" fill="#383531" font-weight="600">돋보기 → 입력 → Enter / 돋보기</text><text x="83" y="578" font-size="26" fill="#82745e" font-weight="400">Search → type → submit</text><rect x="38" y="630" width="824" height="210" rx="18" fill="#fff" stroke="#ded6c8" stroke-width="2"/><text x="65" y="672" font-size="34" fill="#383531" font-weight="600">03  읽기 방식 고르기</text><text x="65" y="708" font-size="29" fill="#82745e" font-weight="600">Choose a reading format</text><path d="M65 728H835" stroke="#ded6c8" stroke-width="2"/><rect x="65" y="745" width="770" height="76" rx="9" fill="#f5f3ef" stroke="none" stroke-width="2"/><text x="83" y="776" font-size="29" fill="#383531" font-weight="600">카드파일 · 메모리 · 백과사전 · 인물록</text><text x="83" y="808" font-size="26" fill="#82745e" font-weight="400">Card file / Memory / Encyclopedia / People</text><rect x="38" y="860" width="824" height="210" rx="18" fill="#fff" stroke="#ded6c8" stroke-width="2"/><text x="65" y="902" font-size="34" fill="#383531" font-weight="600">04  원문과 번역문 읽기</text><text x="65" y="938" font-size="29" fill="#82745e" font-weight="600">Read original or translation</text><path d="M65 958H835" stroke="#ded6c8" stroke-width="2"/><rect x="65" y="975" width="770" height="76" rx="9" fill="#f5f3ef" stroke="none" stroke-width="2"/><text x="83" y="1006" font-size="29" fill="#383531" font-weight="600">월드인포인포 연동은 선택 사항</text><text x="83" y="1038" font-size="26" fill="#82745e" font-weight="400">Optional WII link opens the exact entry</text></svg>
