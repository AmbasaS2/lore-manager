name: Lorebook Manager regression
on:
  pull_request:
  push:
    branches: ['feat/worldinfoinfo-entry-link-20261123']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock jsdom@26 jquery@3
      - run: node --test tests/*.test.cjs
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - run: node --test browser-tests/*.test.cjs
